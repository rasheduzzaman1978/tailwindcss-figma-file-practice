<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rob Davison</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Hero Section -->
  <section class="max-w-6xl mx-auto px-6 py-16">
    <div class="grid md:grid-cols-2 gap-10 items-center">
      
      <!-- Left Content -->
      <div>
        <h1 class="text-4xl font-bold text-gray-800">
          Hello, I'm <span class="text-red-500">Rob Davison</span>
        </h1>
        <p class="mt-4 text-gray-600">
          A Product Designer based in London.
        </p>
        <button class="mt-6 px-6 py-3 bg-red-500 text-white rounded-lg shadow-lg hover:bg-red-600 transition">
          About Me
        </button>
      </div>

      <!-- Right Image -->
      <div class="relative">
        <div class="w-64 h-64 bg-purple-500 rounded-full absolute -z-10 top-4 left-4"></div>
        <img src="profile.jpg" alt="Profile"
             class="w-64 h-64 object-cover rounded-full mx-auto">
      </div>

    </div>
  </section>

  <!-- Projects Section -->
  <section class="bg-white py-16">
    <div class="max-w-6xl mx-auto px-6">
      <h2 class="text-2xl font-bold text-red-500 mb-8">
        Latest Working Project
      </h2>

      <div class="grid md:grid-cols-3 gap-6">
        <!-- Card -->
        <div class="bg-gray-50 p-4 rounded-xl shadow hover:shadow-lg transition">
          <img src="project1.jpg" class="rounded-lg mb-4">
          <h3 class="font-semibold">Pepe - Design Website</h3>
          <p class="text-sm text-gray-500">
            Responsive web design project.
          </p>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl shadow hover:shadow-lg transition">
          <img src="project2.jpg" class="rounded-lg mb-4">
          <h3 class="font-semibold">Creative Agency</h3>
          <p class="text-sm text-gray-500">
            Modern agency landing page.
          </p>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl shadow hover:shadow-lg transition">
          <img src="project3.jpg" class="rounded-lg mb-4">
          <h3 class="font-semibold">Hard Rock Music</h3>
          <p class="text-sm text-gray-500">
            Music streaming UI concept.
          </p>
        </div>
      </div>
    </div>
  </section>

  <!-- Work Inquiry Section -->
  <section class="py-16 text-center">
    <div class="max-w-3xl mx-auto bg-gradient-to-r from-purple-500 to-indigo-600 text-white p-10 rounded-2xl">
      <h2 class="text-2xl font-bold mb-4">Work Inquiry</h2>
      <button class="px-6 py-3 bg-white text-purple-600 font-semibold rounded-lg shadow hover:bg-gray-100 transition">
        Let's Chat
      </button>
    </div>
  </section>

</body>
</html>
